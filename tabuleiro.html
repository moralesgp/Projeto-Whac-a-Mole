<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuleiro do jogo</title>
</head>
<body>
    <header>
        <div class="previousPage">
            <a href="regras.html" aria-label="Voltar para a página de regras">
                <img src="imagens/arrow-up.png" alt="Seta para cima" class="arrow">
            </a>
        </div>
    </header>

    <main>
        <h1>Tabuleiro do jogo</h1>

        <section aria-labelledby="gramado-titulo">
            <h2 id="gramado-titulo">Gramado</h2>
            <div class="gramado">
                <img src="imagens/hole.png" alt="buraco vazio" class="hole" id="buraco0">
                <img src="imagens/hole.png" alt="buraco vazio" class="hole" id="buraco1">
                <img src="imagens/hole.png" alt="buraco vazio" class="hole" id="buraco2">
                <img src="imagens/hole.png" alt="buraco vazio" class="hole" id="buraco3">
                <img src="imagens/hole.png" alt="buraco vazio" class="hole" id="buraco4">
            </div>
        </section>

        <section aria-labelledby="pontuacao-titulo">
            <h2 id="pontuacao-titulo">Pontuação</h2>
            <table>
                <thead>
                    <tr>
                        <th colspan="2">PONTUAÇÃO</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">Acertos</th>
                        <td>
                            <img src="imagens/caractere_0.gif" alt="0">
                            <img src="imagens/caractere_0.gif" alt="0">
                            <img src="imagens/caractere_0.gif" alt="0">
                        </td>
                    </tr>
                    <tr>
                        <th scope="row">Perdidos</th>
                        <td>
                            <img src="imagens/caractere_0.gif" alt="0">
                            <img src="imagens/caractere_0.gif" alt="0">
                            <img src="imagens/caractere_0.gif" alt="0">
                        </td>
                    </tr>
                    <tr>
                        <th scope="row">Errados</th>
                        <td>
                            <img src="imagens/caractere_0.gif" alt="0">
                            <img src="imagens/caractere_0.gif" alt="0">
                            <img src="imagens/caractere_0.gif" alt="0">
                        </td>
                    </tr>
                    <tr>
                        <th scope="row">Saldo</th>
                        <td>
                            <img src="imagens/caractere_0.gif" alt="0">
                            <img src="imagens/caractere_0.gif" alt="0">
                            <img src="imagens/caractere_0.gif" alt="0">
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <div class="nextPage">
            <a href="recordes.html" class="circulo" aria-label="Ir para a página de recordes">
                <img src="imagens/arrow-down.png" alt="Seta para baixo" class="arrow">
            </a>
        </div>
    </footer>
</body>
</html>
